# Install once with:  uv run --directory backend pre-commit install
# Update hook versions with:  pre-commit autoupdate

# Vendored validation artefacts are checked against the publisher's checksums
# (backend/tests/fixtures/ehf/README.md); no hook may rewrite them, and the
# compiled CEN XSLT is larger than the large-file limit on purpose.
exclude: ^backend/tests/fixtures/ehf/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # Secret scanning — blocks commits containing credentials/keys
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks

  # Python lint + format (backend only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
