[project]
name = "myntos"
version = "0.1.0"
description = "Myntos backend — Norwegian accounting with Skatteetaten integrations (skattemelding, MVA-melding, SAF-T)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "Andreas Lindeman", email = "andreas.e.lindeman@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # [email] pulls in email-validator, which backs pydantic's EmailStr — used
    # on every endpoint that accepts an address.
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    # RS256 signing of Maskinporten JWT grants; also verifies Google ID tokens
    "pyjwt[crypto]>=2.9",
    # Argon2id password hashing for application accounts
    "argon2-cffi>=23.1",
    # Multipart form parsing — required by FastAPI for the bilag PDF upload
    "python-multipart>=0.0.9",
    # Reads the text layer of an uploaded faktura so the entry form can fill
    # itself in. Pure Python on purpose: the bytes come from a user, and a native
    # PDF parser is a much larger thing to trust with them.
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # In-memory SQLite for the API tests, so the whole auth flow runs end to end
    # without a PostgreSQL instance.
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myntos"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit (security)
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; S105/S106 flag "hardcoded passwords", which is
# exactly what a password-login test has to contain.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
