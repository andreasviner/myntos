# Local development services. The test suite does NOT require this;
# PostgreSQL is only needed once you work on the ledger/database layer.
#
#   docker compose up -d db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myntos
      POSTGRES_PASSWORD: myntos
      POSTGRES_DB: myntos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myntos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
